name: CI

# Every test runs on every pull request, with a coverage report published alongside it, so a
# regression cannot reach the merged codebase unnoticed. Branch protection on `main` should require
# the `test`, `lint`, `wasm` and `coverage` jobs.
on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Production-code coverage: unit-test modules (src/test.rs, src/math_test.rs), the integration
  # crate and the test-only mock RWA token are excluded from the report.
  COVERAGE_IGNORE: '(/test\.rs|_test\.rs|/tests/|integration_tests|mock_rwa)'
  # Floor for the coverage gate. Deliverable 1's success criterion is *functional* (see
  # docs/TRANCHE_1_DELIVERABLES.md); this only guards against silent erosion.
  MIN_LINE_COVERAGE: "95"

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wasm:
    name: wasm build (all contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build every contract
        run: cargo build --workspace --release --locked --target wasm32v1-none
      - name: "Report and gate contract sizes (Soroban limit 128 KiB)"
        run: |
          set -e
          echo "| contract | bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c%s "$f")
            echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt 131072 ]; then echo "::error::$f exceeds 128 KiB"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: target/wasm32v1-none/release/*.wasm

  test:
    name: test (unit + integration + AMM budget)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build the WASM the CPU-budget test runs against
        run: cargo build --release --locked --target wasm32v1-none -p principal_market_pool
      - name: Run the whole workspace
        run: cargo test --workspace --locked

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build the WASM the CPU-budget test runs against
        run: cargo build --release --locked --target wasm32v1-none -p principal_market_pool
      - name: Coverage (lcov + HTML + summary)
        env:
          RUSTFLAGS: ""
        run: |
          set -e
          cargo llvm-cov --workspace --locked --ignore-filename-regex "$COVERAGE_IGNORE" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" --html --output-dir coverage-html
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" --json --summary-only --output-path coverage-summary.json
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE" | tee coverage.txt
          {
            echo "## Coverage (production code)"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate on the line-coverage floor
        run: |
          python3 - <<'PY'
          import json, os, sys
          total = json.load(open("coverage-summary.json"))["data"][0]["totals"]["lines"]["percent"]
          floor = float(os.environ["MIN_LINE_COVERAGE"])
          print(f"line coverage {total:.2f}% (floor {floor}%)")
          sys.exit(0 if total >= floor else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-html
            lcov.info
            coverage-summary.json
            coverage.txt

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
