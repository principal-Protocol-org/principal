name: Docs

# Publishes the documentation in docs/ as a static site with GitHub Pages. Pull requests build it
# (so a broken link or bad Markdown fails review); pushes to main deploy it.
on:
  pull_request:
    paths: ["docs/**", "book.toml", "README.md"]
  push:
    branches: [main]
    paths: ["docs/**", "book.toml", "README.md"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@mdbook
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
